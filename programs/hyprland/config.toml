[general]
destination = "$HOME/.config/hypr/config.d/99_autogenerated-monitors.conf"
debounce_time_ms = 1500
post_apply_exec = "hyprctl reload"

# Profile: both Sceptre F24 monitors connected (HDMI-A-1 + DP-2)
[profiles.sceptre]
config_file = "hyprconfigs/sceptre.conf"
config_file_type = "static"

[[profiles.sceptre.conditions.required_monitors]]
name = "HDMI-A-1"

[[profiles.sceptre.conditions.required_monitors]]
name = "DP-2"

# Profile: laptop only (also used when the sceptre profile doesn't match)
[fallback_profile]
config_file = "hyprconfigs/laptop.conf"
config_file_type = "static"
